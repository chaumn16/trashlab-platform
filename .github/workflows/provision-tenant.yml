name: Provision tenant

# Triggered by the control plane's Add-tenant form (repository_dispatch), or by
# hand from the Actions tab.
#
# This workflow — not the console — holds VERCEL_TOKEN and GITHUB_TOKEN. Those
# credentials can create repositories and deploy anywhere in the fleet, which is
# the wrong blast radius for a sales-facing web app. Keeping them here also gives
# provisioning a retry button and an audit trail: "who onboarded this customer
# and when" is answerable from the Actions history.

on:
  repository_dispatch:
    types: [provision-tenant]
  workflow_dispatch:
    inputs:
      slug:
        description: "Subdomain / repo / project name (e.g. northwind)"
        required: true
      displayName:
        description: "Company name (e.g. Northwind Disposal)"
        required: true
      plan:
        description: "starter | growth | enterprise"
        required: true
        default: growth
      region:
        description: "iad1 | sfo1 | fra1 | syd1"
        required: true
        default: iad1

concurrency:
  group: provision-${{ github.event.client_payload.slug || inputs.slug }}
  cancel-in-progress: false

permissions:
  contents: write     # the registry commit at the end of provisioning

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checked out with the built-in GITHUB_TOKEN, which Actions always
      # provides. Using a PAT here meant the workflow could not even check
      # itself out until FLEET_GITHUB_TOKEN was set, and failed with
      # "Input required and not supplied: token" — which names neither the
      # missing secret nor what it is for.
      - uses: actions/checkout@v4

      # Fail loudly, early, and specifically. Provisioning needs credentials
      # this repo cannot supply itself; saying so up front beats a cryptic
      # failure five steps later, half way through creating things.
      - name: Check required credentials
        env:
          FLEET_GITHUB_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: |
          missing=""
          [ -z "$FLEET_GITHUB_TOKEN" ] && missing="$missing\n  - secret FLEET_GITHUB_TOKEN  (PAT with repo scope; creates the tenant repo)"
          [ -z "$VERCEL_TOKEN" ]       && missing="$missing\n  - secret VERCEL_TOKEN        (creates the project, domain and deployment)"
          [ -z "$VERCEL_TEAM_ID" ]     && missing="$missing\n  - variable VERCEL_TEAM_ID    (which Vercel scope to create in)"
          if [ -n "$missing" ]; then
            echo "::error::Cannot provision — missing credentials on this repository:$missing"
            printf 'Set them with:\n'
            printf '  gh secret   set FLEET_GITHUB_TOKEN --repo %s\n' "$GITHUB_REPOSITORY"
            printf '  gh secret   set VERCEL_TOKEN       --repo %s\n' "$GITHUB_REPOSITORY"
            printf '  gh variable set VERCEL_TEAM_ID     --repo %s --body "team_xxx"\n' "$GITHUB_REPOSITORY"
            exit 1
          fi
          echo "All provisioning credentials present."

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve inputs
        id: input
        run: |
          echo "slug=${{ github.event.client_payload.slug || inputs.slug }}"               >> "$GITHUB_OUTPUT"
          echo "name=${{ github.event.client_payload.displayName || inputs.displayName }}" >> "$GITHUB_OUTPUT"
          echo "plan=${{ github.event.client_payload.plan || inputs.plan }}"               >> "$GITHUB_OUTPUT"
          echo "region=${{ github.event.client_payload.region || inputs.region }}"         >> "$GITHUB_OUTPUT"

      # Dry run first, always. It prints every Vercel and GitHub call without
      # making one, so a bad slug or a duplicate is caught before anything is
      # created — provisioning is far cheaper to prevent than to unwind.
      - name: Plan
        run: |
          node packages/cli/bin/platform.mjs tenant add "${{ steps.input.outputs.slug }}" \
            --name="${{ steps.input.outputs.name }}" \
            --plan="${{ steps.input.outputs.plan }}" \
            --region="${{ steps.input.outputs.region }}"

      - name: Provision
        run: |
          node packages/cli/bin/platform.mjs tenant add "${{ steps.input.outputs.slug }}" \
            --name="${{ steps.input.outputs.name }}" \
            --plan="${{ steps.input.outputs.plan }}" \
            --region="${{ steps.input.outputs.region }}" \
            --apply
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}

      # `platform tenant add` writes the new tenant into registry/tenants.json.
      # Committing it is what makes the tenant appear on the fleet dashboard.
      - name: Commit registry
        run: |
          git config user.name  "trashlab-bot"
          git config user.email "bot@trashlab.internal"
          git add registry/tenants.json tenants/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No registry change to commit."
          else
            git commit -m "provision: ${{ steps.input.outputs.slug }} (${{ steps.input.outputs.name }})

          Requested by ${{ github.event.client_payload.requestedBy || github.actor }}."
            git push
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ steps.input.outputs.name }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Slug | \`${{ steps.input.outputs.slug }}\` |"
            echo "| URL | https://tenant-${{ steps.input.outputs.slug }}.vercel.app |"
            echo "| Repo | \`trashlab/tenant-${{ steps.input.outputs.slug }}\` |"
            echo "| Plan | ${{ steps.input.outputs.plan }} |"
            echo "| Region | ${{ steps.input.outputs.region }} |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
