name: Release core

# Builds @trashlab/core into a tarball and attaches it to a GitHub Release.
#
# There is no package registry. Nothing is published anywhere public or private;
# the release asset is the canonical artifact, and the copy that actually runs is
# the one the fleet controller vendors into each tenant repo at vendor/.
#
# Cutting a release deploys nothing. Core reaches production only when a tenant's
# vendored tarball is swapped and that tenant is deployed — which is what makes
# staged rollouts possible. See docs/RUNBOOK-rollout.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # to create the Release and upload the asset
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./packages/core/package.json').version")
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package version $PKG"
            exit 1
          fi

      # The contract tests run against the demo tenants before anything is
      # released. If core breaks its own extension contract, no tenant should
      # ever be offered the build.
      - name: Conformance (demo tenants)
        run: |
          npm run build -w @trashlab/core
          for t in acme globex; do
            ( cd "tenants/$t" && node --test tests/*.test.ts )
          done

      - name: Pack
        id: pack
        run: |
          npm run pack -w @trashlab/core
          VERSION=$(node -p "require('./packages/core/package.json').version")
          FILE="dist-releases/trashlab-core-$VERSION.tgz"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$FILE"       >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -lh "$FILE"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.pack.outputs.version }}
          FILE: ${{ steps.pack.outputs.file }}
          SHA: ${{ steps.pack.outputs.sha256 }}
        run: |
          gh release create "v$V" "$FILE" \
            --title "core v$V" \
            --notes "\`@trashlab/core@$V\`

          sha256: \`$SHA\`

          Not published to any registry. Roll it out with:

          \`\`\`
          platform fleet rollout --to=$V --channel=canary --apply
          \`\`\`
          " || gh release upload "v$V" "$FILE" --clobber

      - name: Summary
        run: |
          {
            echo "### Released core v${{ steps.pack.outputs.version }}"
            echo ""
            echo "sha256: \`${{ steps.pack.outputs.sha256 }}\`"
            echo ""
            echo "No tenant is affected yet. Roll it out with:"
            echo '```'
            echo "platform fleet rollout --to=${{ steps.pack.outputs.version }} --channel=canary --apply"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
