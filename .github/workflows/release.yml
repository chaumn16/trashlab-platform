name: Release core

# Publishes @trashlab/core to GitHub Packages on any pushed v* tag.
#
# Publishing deploys nothing. Core reaches production only when a tenant's build
# installs it, and tenant pins are moved by the fleet controller in batches.
# That indirection is what makes staged rollouts possible — see
# docs/RUNBOOK-rollout.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag to publish under (canary, beta, stable)"
        required: true
        default: canary

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@trashlab"

      - name: Install
        run: npm ci

      # A published package with no dist/ installs cleanly and then fails at
      # import time in every tenant that picks it up. Build before publish,
      # always.
      - name: Build
        run: npm run build -w @trashlab/core

      # The contract tests run against the demo tenants before anything is
      # published. If core breaks its own extension contract, no tenant should
      # ever see the release.
      - name: Conformance (demo tenants)
        run: |
          for t in acme globex; do
            ( cd "tenants/$t" && node --test tests/*.test.ts )
          done

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./packages/core/package.json').version")
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package version $PKG"
            exit 1
          fi

      - name: Publish
        run: npm publish -w @trashlab/core --tag "${DIST_TAG:-canary}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ github.event.inputs.dist_tag }}

      - name: Summary
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          {
            echo "### Published \`@trashlab/core@$VERSION\`"
            echo ""
            echo "dist-tag: \`${DIST_TAG:-canary}\`"
            echo ""
            echo "No tenant is affected yet. Roll it out with:"
            echo '```'
            echo "platform fleet rollout --to=$VERSION --channel=canary --apply"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIST_TAG: ${{ github.event.inputs.dist_tag }}
